name: Release
on:
  push:
    paths: [.github/workflows/build.yml, publication-source.zip]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Import prepared sources if present
        run: |
          if [ ! -f publication-source.zip ]; then exit 0; fi
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile('publication-source.zip') as archive:
              for item in archive.infolist():
                  name = pathlib.PurePosixPath(item.filename)
                  if name.is_absolute() or '..' in name.parts or '.git' in name.parts:
                      raise SystemExit('Unsafe archive path')
                  if name.parts[0] == '.github':
                      continue
                  destination = (root / item.filename).resolve()
                  if not destination.is_relative_to(root):
                      raise SystemExit('Unsafe destination')
                  archive.extract(item, root)
          PY
          rm publication-source.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import HA Outfit Clock 1.7.1 sources and documentation previews'
          git push origin HEAD:main
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test
        run: |
          python3 tools/test-clock.py
          node tools/test-renderer.cjs
          node tools/test-configurator.cjs
      - name: Build
        run: python3 tools/build.py --android-platform 35 --version "${GITHUB_REF_NAME#v}"
      - name: Verify package
        run: python3 tools/verify-package.py
      - name: Attach plugin assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 dist/kiosk-satellite-plugin.json konfigurator-ikon.html --clobber
